version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - WEBHOOK_SIGNATURE_REQUIRED=true
      - MAX_DM_RETRIES=5
      - MOCK_API_BASE_URL=https://pseudogram-api.onrender.com
      - PSEUDOGRAM_API_KEY=${PSEUDOGRAM_API_KEY:-mock-key}
    restart: always
